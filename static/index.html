<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zebra · Automatizador de Cronograma</title>
<style>
  :root{
    --ink:#111315; --paper:#fff; --muted:#6b7177; --line:#e4e7ea;
    --gold:#c9a227; --soft:#f6f7f8;
    --ok:#1f9d55; --proc:#2563eb; --pend:#9aa0a6; --block:#e02424;
    --warn:#b7791f; --warnbg:#fff8e1;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--soft);color:var(--ink);font-size:14px}
  header{background:var(--ink);color:#fff;padding:0;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
  .hbar{padding:13px 22px;display:flex;align-items:center;gap:14px}
  .goldline{height:3px;background:var(--gold)}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:3px;font-size:17px}
  .stripe{width:24px;height:24px;border-radius:5px;background:repeating-linear-gradient(135deg,#111 0 4px,var(--gold) 4px 8px);border:1px solid #333}
  .logoimg{height:54px;width:auto;display:block}
  header .sp{flex:1}
  header select{background:#1c1f22;color:#fff;border:1px solid #34383c}
  .wrap{max-width:1560px;margin:0 auto;padding:18px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-weight:600;color:var(--ink);transition:.15s;font-size:13px}
  button:hover{background:var(--soft)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{opacity:.9}
  button.gold{background:var(--gold);border-color:var(--gold);color:#111}
  button.ghostdel{color:var(--block);border-color:#f3d2d2;background:#fff;padding:4px 8px;font-size:12px}
  input,select,textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--line);flex-wrap:wrap}
  .tabs button{border:none;border-radius:0;background:none;padding:10px 15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
  .tabs button.act{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .line-head{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--ink);color:#fff}
  .line-head input{background:rgba(255,255,255,.1);border:none;color:#fff;font-weight:700;font-size:14px;flex:1;max-width:430px}
  .line-head input::placeholder{color:#bbb}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--soft)}
  td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent}
  td input:hover,td select:hover,td textarea:hover{border-color:var(--line);background:#fff}
  td.tname input{font-weight:600}
  td.tname textarea{font-size:11.5px;color:var(--muted);resize:vertical;min-height:24px;margin-top:3px;line-height:1.3}
  .col-days input{width:60px;text-align:center}
  .dates{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:12px}
  select.status{border-radius:20px;font-weight:700;font-size:11px;color:#fff;border:none;padding:5px 8px;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
  .st-Pendiente{background:var(--pend)} .st-Enproceso{background:var(--proc)} .st-Completado{background:var(--ok)} .st-Bloqueado{background:var(--block)}
  .add-row td{padding:8px 10px;background:var(--soft)}
  .add-row button{font-size:12px;padding:5px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .summary-card{padding:16px}
  .summary-card h4{margin:0 0 10px;font-size:14px}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
  .prog>i{display:block;height:100%;background:var(--ok)}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:3px 0}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  .pill{font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
  dialog{border:none;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:540px;width:92%}
  dialog::backdrop{background:rgba(17,19,21,.45)}
  dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between;align-items:center}
  dialog .db{padding:20px;max-height:62vh;overflow:auto}
  dialog .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:200;font-weight:600;opacity:0;pointer-events:none;transition:.3s}
  .toast.show{opacity:1}
  label.fl{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .small{font-size:12px;color:var(--muted)}
  .issue{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:13px}
  .issue.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f0e0b0}
  .issue.error{background:#fdecec;color:var(--block);border:1px solid #f3d2d2}
  .issue.ok{background:#eafaf0;color:var(--ok);border:1px solid #c3ecd2}
  .sechead{padding:11px 16px;background:var(--ink);color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .help{font-size:11px;color:var(--muted);font-style:italic}
  a.dl{display:inline-block;text-decoration:none}
  /* ---- Gantt ---- */
  .gantt{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .g-labels{flex:0 0 190px;border-right:1px solid var(--line);background:var(--soft)}
  .g-scroll{flex:1;overflow-x:auto}
  .g-axis{height:46px;display:flex;flex-direction:column;border-bottom:1px solid var(--line);background:var(--soft)}
  .g-months{display:flex;height:22px}
  .g-month{font-size:11px;font-weight:700;color:var(--ink);border-right:1px solid var(--line);padding:3px 6px;white-space:nowrap;overflow:hidden;text-transform:capitalize}
  .g-days{display:flex;height:24px}
  .g-day{flex:0 0 auto;font-size:10px;color:var(--muted);text-align:center;border-right:1px solid #eef0f2;line-height:24px}
  .g-day.we{background:#f0f1f3}
  .g-axis-spacer{height:46px;border-bottom:1px solid var(--line)}
  .g-lab{height:40px;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-row{height:40px;position:relative;border-bottom:1px solid var(--line)}
  .g-row .we-bg{position:absolute;top:0;bottom:0;background:#f6f7f8}
  .g-bar{position:absolute;top:8px;height:24px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;line-height:24px;padding:0 7px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:default}
  .g-bar.done{opacity:.55}
  .g-milestone{position:absolute;top:10px;width:18px;height:18px;transform:rotate(45deg);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .g-legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px 0;font-size:12px;color:var(--muted)}
  .g-legend span{display:inline-flex;align-items:center;gap:6px}
  .g-dot{width:12px;height:12px;border-radius:3px;display:inline-block}
  .g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--block);z-index:3}
  /* ---- selector de departamentos (Responsable) ---- */
  .rcell{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .rchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;background:var(--c,#9aa0a6);border-radius:20px;padding:2px 5px 2px 10px;white-space:nowrap}
  .rchip button{all:unset;cursor:pointer;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:rgba(255,255,255,.3);font-size:10px;font-weight:700}
  .rchip button:hover{background:rgba(255,255,255,.55)}
  td select.raddsel{width:auto;min-width:74px;border:1px dashed var(--line);border-radius:20px;font-size:11px;color:var(--muted);background:#fff;padding:3px 6px}
  td select.raddsel:hover{border-color:var(--gold);background:#fff}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><img src="/static/logo.png" alt="Zebra" class="logoimg"></div>
    <span class="small" style="color:#9aa0a6;letter-spacing:1px">CRONOGRAMA</span>
    <div class="sp"></div>
    <select id="projSel" onchange="openProj(this.value)"></select>
    <button class="gold" onclick="openNewProj()">+ Nuevo proyecto</button>
    <button onclick="setTab('manage');render()" id="btnManage" title="Proyectos y plantillas">📁 Proyectos</button>
    <button onclick="setTab('monday');render()" id="btnMonday" title="Configuración Monday">⚙ Monday</button>
  </div>
  <div class="goldline"></div>
</header>

<div class="wrap" id="app"><div class="empty">Cargando…</div></div>

<!-- nuevo proyecto -->
<dialog id="dlgNew">
  <div class="dh">Nuevo proyecto <button onclick="dlgNew.close()">✕</button></div>
  <div class="db">
    <label class="fl">Nombre del cliente</label>
    <input id="npClient" placeholder="Ej. Clínica Sonrisa" style="width:100%" autocomplete="off">
    <div class="small" style="margin-top:4px">Se crea como cliente nuevo en Monday al publicar.</div>
    <label class="fl">Fecha inicial</label>
    <input id="npStart" type="date" style="width:100%">
    <label class="fl">Partir de</label>
    <select id="npTemplate" style="width:100%"></select>
  </div>
  <div class="df">
    <button onclick="dlgNew.close()">Cancelar</button>
    <button class="primary" onclick="createProject()">Crear</button>
  </div>
</dialog>

<!-- guardar plantilla -->
<dialog id="dlgTpl">
  <div class="dh">Guardar como plantilla <button onclick="dlgTpl.close()">✕</button></div>
  <div class="db">
    <p class="small">Se guarda solo la estructura (líneas, tareas, días, descripciones). No incluye responsables, fechas ni estados.</p>
    <label class="fl">Nombre de la plantilla</label>
    <input id="tplName" placeholder="Ej. Lanzamiento estándar clínicas" style="width:100%">
  </div>
  <div class="df">
    <button onclick="dlgTpl.close()">Cancelar</button>
    <button class="primary" onclick="saveTemplate()">Guardar</button>
  </div>
</dialog>

<!-- publicar -->
<dialog id="dlgLaunch">
  <div class="dh">Publicar a Monday <button onclick="dlgLaunch.close()">✕</button></div>
  <div class="db" id="launchBody"></div>
  <div class="df" id="launchFoot"><button onclick="dlgLaunch.close()">Cerrar</button></div>
</dialog>

<!-- confirmar (en lugar de window.confirm, que algunos navegadores bloquean) -->
<dialog id="dlgConfirm">
  <div class="dh"><span id="confTitle">Confirmar</span> <button onclick="confResolve(false)">✕</button></div>
  <div class="db"><p id="confMsg" style="margin:0;line-height:1.4"></p></div>
  <div class="df"><button onclick="confResolve(false)">Cancelar</button>
    <button class="ghostdel" id="confOk" style="padding:8px 13px" onclick="confResolve(true)">Eliminar</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
let STATE=null, TAB="crono", TEMPLATES=[], CFG={config:{},keys:[]}, DEPTS_CAT=[], PEOPLE_CAT=[];
const STATUSES=["Pendiente","En proceso","Completado","Bloqueado"];
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300);}
// confirmación propia (window.confirm puede estar bloqueado por el navegador)
let _confRes=null;
function confirmDialog(msg,okLabel){
  $("#confMsg").textContent=msg; $("#confOk").textContent=okLabel||"Eliminar";
  try{dlgConfirm.showModal();}catch(e){}
  return new Promise(res=>{_confRes=res;});
}
function confResolve(v){const r=_confRes;_confRes=null;try{dlgConfirm.close();}catch(e){}if(r)r(v);}
async function api(url,opt){const r=await fetch(url,Object.assign({headers:{"Content-Type":"application/json"}},opt));return r.json();}
function fmt(d){if(!d)return "—";const p=String(d).slice(0,10).split("-");return `${p[2]}/${p[1]}`;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function stClass(s){return "st-"+s.replace(/\s/g,"");}

async function boot(){
  const projs=await api("/api/projects");
  const sel=$("#projSel"); sel.innerHTML="";
  if(!projs.length){
    $("#app").innerHTML='<div class="empty">No hay proyectos.<br><br><button class="gold" onclick="openNewProj()">+ Crear el primero</button></div>';
    return;
  }
  projs.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=`${p.client} · ${p.status}`;sel.appendChild(o);});
  loadProject(projs[0].id);
}
async function openNewProj(){
  $("#npStart").value=new Date().toISOString().slice(0,10);
  TEMPLATES=await api("/api/templates");
  const t=$("#npTemplate");
  t.innerHTML='<option value="">Estructura original (del Excel)</option>'+TEMPLATES.map(x=>`<option value="${x.id}">Plantilla: ${esc(x.name)}</option>`).join("");
  dlgNew.showModal();
}
async function createProject(){
  const client=$("#npClient").value.trim(), start=$("#npStart").value, tpl=$("#npTemplate").value;
  if(!client){toast("Escribe el cliente");return;}
  const body={client,start_date:start}; if(tpl) body.template_id=parseInt(tpl);
  const r=await api("/api/projects",{method:"POST",body:JSON.stringify(body)});
  dlgNew.close(); $("#npClient").value="";
  await boot(); $("#projSel").value=r.id; loadProject(r.id); toast("Proyecto creado");
}
async function loadProject(id){STATE=await api(`/api/projects/${id}`);STATE.id=parseInt(id);CFG=await api("/api/config");DEPTS_CAT=await api("/api/monday/departments");PEOPLE_CAT=await api("/api/monday/people");render();}
function setTab(t){TAB=t;}

function render(){
  if(TAB=="monday"){renderMondayTab();return;}
  if(TAB=="manage"){renderManageTab();return;}
  if(!STATE){boot();return;}
  const p=STATE.project;
  let h=`<div class="bar">
    <span class="pill">Cliente</span><input value="${esc(p.client)}" onchange="updMeta('client',this.value)" style="min-width:190px">
    <span class="pill">Inicio</span><input type="date" value="${String(p.start_date).slice(0,10)}" onchange="updMeta('start_date',this.value)">
    <span class="pill">Estado</span>
    <select onchange="updMeta('status',this.value)">${["En proceso","Lanzado","Pausado"].map(s=>`<option ${p.status==s?'selected':''}>${s}</option>`).join("")}</select>
    <div style="flex:1"></div>
    <button onclick="openTpl()">Guardar como plantilla</button>
    <a class="dl" href="/api/projects/${STATE.id}/pdf" target="_blank"><button>⬇ PDF</button></a>
    <button class="ghostdel" onclick="delProject()">Eliminar</button>
    <button class="primary" onclick="launch()">🚀 Publicar a Monday</button>
  </div>
  <div class="tabs">
    <button class="${TAB=='crono'?'act':''}" onclick="setTab('crono');render()">Cronograma</button>
    <button class="${TAB=='gantt'?'act':''}" onclick="setTab('gantt');render()">Gantt</button>
    <button class="${TAB=='resumen'?'act':''}" onclick="setTab('resumen');render()">Resumen</button>
    <button class="${TAB=='resp'?'act':''}" onclick="setTab('resp');render()">Responsables</button>
    <button class="${TAB=='feriados'?'act':''}" onclick="setTab('feriados');render()">Feriados</button>
  </div>`;
  if(TAB=="crono") h+=renderCrono();
  if(TAB=="gantt") h+=renderGantt();
  if(TAB=="resumen"){h+=`<div id="sumBox"><div class="empty">Calculando…</div></div>`;loadSummary();}
  if(TAB=="resp") h+=renderResp();
  if(TAB=="feriados"){h+=`<div id="holBox"><div class="empty">Cargando…</div></div>`;loadHolidays();}
  $("#app").innerHTML=h;
}

function allTasks(){const a=[];STATE.lines.forEach(l=>l.tasks.forEach(t=>a.push({id:t.id,name:`[${l.name.slice(0,10)}] ${t.name.slice(0,38)}`})));return a;}
function findTask(tid){for(const l of STATE.lines){const t=l.tasks.find(x=>x.id===tid);if(t)return t;}return null;}
function respDepts(t){return (t.responsible||"").split(",").map(s=>s.trim()).filter(Boolean);}

// celda "Responsable": departamentos como etiquetas de color + lista para agregar
function respCell(t){
  const cur=respDepts(t);
  const avail=DEPTS_CAT.map(d=>d.name).filter(n=>!cur.includes(n));
  const jss=s=>"'"+String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'";
  const chips=cur.map(dep=>`<span class="rchip" style="--c:${deptColor(dep)}">${esc(dep)}<button title="Quitar" onclick="setResp(${t.id},${jss(dep)},false)">✕</button></span>`).join("");
  const add=avail.length?`<select class="raddsel" onchange="if(this.value){setResp(${t.id},this.value,true)}">
    <option value="">+ depto</option>${avail.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>`:"";
  return `<div class="rcell">${chips||'<span class="small" style="color:var(--muted)">—</span>'}${add}</div>`;
}
// celda "Inicio": editable solo si la tarea es secuencial (sin dependencia explícita)
function startCell(t){
  if(t.depends_on) return `<td class="dates" title="Sigue a la tarea de la que depende">${fmt(t.start_date)}</td>`;
  const ov=t.start_override?String(t.start_override).slice(0,10):"";
  const val=ov||String(t.start_date||"").slice(0,10);
  const reset=ov?`<button class="ghostdel" style="padding:1px 5px;margin-left:3px" title="Volver a automático" onclick="updTask(${t.id},'start_override',null)">↺</button>`:"";
  return `<td class="dates"><input type="date" value="${val}" style="width:120px;font-weight:${ov?'700':'400'}"
    title="${ov?'Inicio fijado manualmente':'Inicio automático (secuencial). Cámbialo para fijarlo.'}"
    onchange="updTask(${t.id},'start_override',this.value||null)">${reset}</td>`;
}
async function setResp(tid,dep,add){
  const t=findTask(tid); if(!t) return;
  let cur=respDepts(t);
  if(add){ if(!cur.includes(dep)) cur.push(dep); }
  else { cur=cur.filter(x=>x!==dep); }
  await updTask(tid,'responsible',cur.join(", "));
}

function renderCrono(){
  let h="";
  STATE.lines.forEach(line=>{
    h+=`<div class="card"><div class="line-head">
      <input value="${esc(line.name)}" onchange="renameLine(${line.id},this.value)">
      <span class="small" style="color:#ccc">${line.tasks.length} tareas</span><div style="flex:1"></div>
      <button class="ghostdel" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)" onclick="delLine(${line.id})">Quitar línea</button>
    </div><table><thead><tr>
      <th style="width:32%">Tarea / descripción</th><th>Estado</th><th>Días</th><th>Inicio</th><th>Final</th><th>Responsable</th><th>Depende de</th><th></th>
    </tr></thead><tbody>`;
    line.tasks.forEach(t=>{
      const deps=allTasks().filter(x=>x.id!=t.id);
      h+=`<tr>
        <td class="tname">
          <input value="${esc(t.name)}" onchange="updTask(${t.id},'name',this.value)">
          <textarea rows="1" placeholder="+ descripción (opcional)" onchange="updTask(${t.id},'description',this.value)">${esc(t.description||"")}</textarea>
        </td>
        <td><select class="status ${stClass(t.status)}" onchange="updTask(${t.id},'status',this.value)">
          ${STATUSES.map(s=>`<option ${t.status==s?'selected':''}>${s}</option>`).join("")}</select></td>
        <td class="col-days"><input type="number" step="0.5" min="0" value="${t.days}" onchange="updTask(${t.id},'days',parseFloat(this.value)||0)"></td>
        ${startCell(t)}
        <td class="dates">${fmt(t.end_date)}</td>
        <td>${respCell(t)}</td>
        <td><select onchange="updTask(${t.id},'depends_on',this.value?parseInt(this.value):null)">
          <option value="">Secuencial</option>
          ${deps.map(d=>`<option value="${d.id}" ${t.depends_on==d.id?'selected':''}>${esc(d.name)}</option>`).join("")}
        </select></td>
        <td><button class="ghostdel" onclick="delTask(${t.id})">✕</button></td>
      </tr>`;
    });
    h+=`<tr class="add-row"><td colspan="8"><button onclick="addTask(${line.id})">+ Agregar tarea</button></td></tr></tbody></table></div>`;
  });
  h+=`<button class="gold" onclick="addLine()">+ Agregar línea de trabajo paralela</button>`;
  return h;
}

// ---------- Gantt (líneas horizontales por fecha, color por departamento)
const G_PALETTE=["#2563eb","#c9a227","#1f9d55","#7c3aed","#e8590c","#0891b2","#db2777","#475569"];
function pd(s){return s?new Date(String(s).slice(0,10)+"T00:00:00"):null;}
function dayDiff(a,b){return Math.round((a-b)/86400000);}
function firstDept(resp){return (resp||"").split(",")[0].trim();}
function deptColor(name){
  if(!name) return "#9aa0a6";
  const d=DEPTS_CAT.find(x=>x.name===name);
  if(d&&d.color) return d.color;
  const i=DEPTS_CAT.findIndex(x=>x.name===name);
  return G_PALETTE[(i>=0?i:0)%G_PALETTE.length];
}
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function renderGantt(){
  // reunir tareas con fecha
  let min=null,max=null;
  STATE.lines.forEach(l=>l.tasks.forEach(t=>{
    if(!t.start_date) return;
    const s=pd(t.start_date), e=pd(t.end_date||t.start_date);
    if(!min||s<min) min=s; if(!max||e>max) max=e;
  }));
  if(!min) return `<div class="card"><div class="empty">No hay tareas con fechas todavía.<br>Agrega días a las tareas en el Cronograma para verlas aquí.</div></div>`;

  const DAY=24, total=dayDiff(max,min)+1, W=total*DAY;
  const used=new Set();

  // eje: meses + días
  let months="", daysHtml="";
  const segs=[]; // {label,count}
  for(let i=0;i<total;i++){
    const d=new Date(min.getTime()+i*86400000);
    const we=d.getDay()===0||d.getDay()===6;
    daysHtml+=`<div class="g-day${we?' we':''}" style="width:${DAY}px">${d.getDate()}</div>`;
    const key=d.getMonth()+"-"+d.getFullYear();
    if(!segs.length||segs[segs.length-1].key!==key)
      segs.push({key,label:`${MESES[d.getMonth()]} ${d.getFullYear()}`,count:1});
    else segs[segs.length-1].count++;
  }
  segs.forEach(s=>{months+=`<div class="g-month" style="width:${s.count*DAY}px">${s.label}</div>`;});

  // marcador de hoy
  const today=pd(new Date().toISOString().slice(0,10));
  let todayMark="";
  if(today>=min&&today<=max){const x=dayDiff(today,min)*DAY;todayMark=`<div class="g-today" style="left:${x}px"></div>`;}
  // fondo de fines de semana (reutilizable por fila)
  let weBg="";
  for(let i=0;i<total;i++){
    const d=new Date(min.getTime()+i*86400000);
    if(d.getDay()===0||d.getDay()===6) weBg+=`<div class="we-bg" style="left:${i*DAY}px;width:${DAY}px"></div>`;
  }

  // etiquetas (izquierda) y filas (derecha) alineadas por índice de línea
  let labs="", rows="";
  STATE.lines.forEach(line=>{
    labs+=`<div class="g-lab" title="${esc(line.name)}">${esc(line.name)}</div>`;
    let bars="";
    line.tasks.forEach(t=>{
      if(!t.start_date) return;
      const s=pd(t.start_date), e=pd(t.end_date||t.start_date);
      const off=dayDiff(s,min)*DAY, dur=(dayDiff(e,s)+1)*DAY;
      const dep=firstDept(t.responsible); used.add(dep||"(sin depto)");
      const col=deptColor(dep);
      const done=t.status==="Completado"?" done":"";
      const tip=`${t.name} · ${dep||'sin depto'} · ${fmt(t.start_date)}→${fmt(t.end_date)} · ${t.status}`;
      if(t.days&&t.days>0){
        bars+=`<div class="g-bar${done}" style="left:${off}px;width:${Math.max(dur-3,14)}px;background:${col}" title="${esc(tip)}">${esc(t.name)}</div>`;
      }else{
        bars+=`<div class="g-milestone" style="left:${off}px;background:${col}" title="${esc(tip)}"></div>`;
      }
    });
    rows+=`<div class="g-row" style="width:${W}px">${weBg}${todayMark}${bars}</div>`;
  });

  // leyenda de departamentos usados
  let legend="";
  used.forEach(dep=>{legend+=`<span><i class="g-dot" style="background:${deptColor(dep==='(sin depto)'?'':dep)}"></i>${esc(dep)}</span>`;});

  return `<div class="gantt">
    <div class="g-labels"><div class="g-axis-spacer"></div>${labs}</div>
    <div class="g-scroll">
      <div class="g-axis" style="width:${W}px"><div class="g-months">${months}</div><div class="g-days">${daysHtml}</div></div>
      ${rows}
    </div>
  </div>
  <div class="g-legend">${legend}<span style="margin-left:auto"><i class="g-dot" style="background:var(--block);width:2px;border-radius:0"></i>Hoy · ◆ hito (0 días)</span></div>`;
}

async function loadSummary(){
  const s=await api(`/api/projects/${STATE.id}/summary`);
  let h='<div class="grid">';
  s.lines.forEach(l=>{
    const pct=l.total?Math.round((l.done/l.total)*100):0;
    h+=`<div class="card summary-card"><h4>${esc(l.line)}</h4>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="kv"><span>Avance</span><b>${l.done}/${l.total} (${pct}%)</b></div>
      <div class="kv"><span>Inicio</span><span>${fmt(l.ini)}</span></div>
      <div class="kv"><span>Fin estimado</span><span>${fmt(l.fin)}</span></div>
      <div class="kv"><span>Días de trabajo</span><span>${l.dias||0}</span></div></div>`;
  });
  h+='</div>';
  h+=`<div class="card summary-card"><h4>Proyecto completo</h4>
    <div class="kv"><span>Arranque</span><b>${fmt(s.overall.ini)}</b></div>
    <div class="kv"><span>Cierre estimado</span><b>${fmt(s.overall.fin)}</b></div>
    <div class="small" style="margin-top:8px">Se guarda en la base de datos y viaja en el payload al publicar.</div></div>`;
  const el=$("#sumBox"); if(el) el.innerHTML=h;
}

function personOptions(depto, current){
  // SOLO la gente del catálogo (pestaña Monday) asociada a ESTE departamento
  const list=PEOPLE_CAT.filter(p=>p.department===depto);
  const ph=list.length?'— elegir persona —':'— sin personas en este depto —';
  let opts=`<option value="">${ph}</option>`, found=false;
  list.forEach(p=>{
    const sel=p.name===current; if(sel) found=true;
    const warn=p.monday_user_id?'':'  ⚠ sin user_id';
    opts+=`<option ${sel?'selected':''}>${esc(p.name)}${warn}</option>`;
  });
  if(current&&!found) opts+=`<option selected>${esc(current)}</option>`;  // conserva valor previo
  return opts;
}

  projs.forEach(p=>{
    h+=`<tr>
      <td><b>${esc(p.client)}</b></td>
      <td><span class="pill">${esc(p.status)}</span></td>
      <td>${fmt(p.start_date)}/${String(p.start_date).slice(0,4)}</td>

        <button onclick="openProj(${p.id})">✏️ Abrir / editar</button>
        <a class="dl" href="/api/projects/${p.id}/pdf" target="_blank"><button>⬇ PDF</button></a>
        <button class="ghostdel" onclick="delProjFromManage(${p.id})">Eliminar</button>
      </td></tr>`;
  });
  h+=`</tbody></table></div>`;

  h+=`<div class="card"><div class="sechead"><span>Plantillas (solo estructura)</span><span class="small" style="color:#ccc">${tpls.length}</span></div>
    <table><thead><tr><th style="width:55%">Nombre</th><th>Creada</th><th style="text-align:right">Acciones</th></tr></thead><tbody>`;
  if(!tpls.length) h+=`<tr><td colspan="3" class="small" style="padding:16px">No hay plantillas. Crea una desde un proyecto con el botón “Guardar como plantilla”.</td></tr>`;

  $("#app").innerHTML=h;

async function delProjFromManage(id){if(!await confirmDialog("¿Eliminar todo el proyecto y sus tareas?"))return;await api(`/api/projects/${id}`,{method:"DELETE"});await boot();toast("Proyecto eliminado");setTab('manage');render();}

async function newFromTemplate(id){await openNewProj();const t=$("#npTemplate");if(t)t.value=String(id);}

// ---------- Monday tab (config + catálogos)
async function renderMondayTab(){
  const cfg=await api("/api/config");
  const people=await api("/api/monday/people");
  const depts=await api("/api/monday/departments");
  const labels={monday_board_id:"Board ID",col_status:"Columna Estatus (id)",col_person_esp:"Columna Especialista (id)",
    col_person_sm:"Columna SM (id)",col_department:"Columna Departamento (id)",col_client:"Columna Cliente (id)",col_deadline:"Columna Fecha límite (id)"};
  let h=`<div class="bar"><button onclick="setTab('crono');boot()">← Volver al cronograma</button></div>
  <div class="card"><div class="sechead"><span>Configuración del board de Monday</span></div><div style="padding:16px">
    <p class="small">Estos IDs salen del API de Monday o de la configuración de columnas del board. El token va como variable de entorno <code>MONDAY_API_TOKEN</code> en EasyPanel.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">`;
  cfg.keys.forEach(k=>{
    h+=`<div><label class="fl">${labels[k]||k}</label><input style="width:100%" value="${esc(cfg.config[k]||'')}" onchange="saveCfg('${k}',this.value)"></div>`;
  });
  h+=`</div></div></div>`;

  // mapeo de estatus -> label/índice del board
  let smap={}; try{smap=JSON.parse(cfg.config.status_map||"{}");}catch(e){}
  h+=`<div class="card"><div class="sechead"><span>Mapeo de estatus → Monday</span></div><div style="padding:16px">
    <p class="small">Cada estatus de la app se traduce al <b>label</b> o <b>índice</b> de tu columna de Estatus en Monday. Escribe un <b>número</b> para usar índice (ej. <code>2</code>) o el <b>texto exacto</b> del label (ej. <code>En proceso</code>). Déjalo <b>vacío</b> para no escribir esa columna y dejar el estatus por defecto del board.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
    ${STATUSES.map((s,i)=>`<div><label class="fl">${esc(s)}</label><input style="width:100%" id="sm_${i}" value="${esc(smap[s]||'')}" placeholder="label o índice" onchange="saveStatusMap()"></div>`).join("")}
    </div></div></div>`;

  // opciones de departamento (para asociar personas)
  const deptOpts=sel=>`<option value="">— sin depto —</option>`+depts.map(d=>`<option value="${esc(d.name)}" ${sel===d.name?'selected':''}>${esc(d.name)}</option>`).join("");

  // personas (cada persona pertenece a un departamento)
  h+=`<div class="card"><div class="sechead"><span>Catálogo de personas → user_id de Monday</span></div>
    <p class="small" style="padding:8px 16px 0">Asocia cada persona a su departamento. Un departamento puede tener varias personas; al publicar, una tarea cuyo responsable sea un depto incluye a todas sus personas con user_id.</p>
    <table><thead><tr><th style="width:34%">Persona (Zebra)</th><th>Departamento</th><th>Monday user_id</th><th></th></tr></thead><tbody>`;
  people.forEach(p=>{
    h+=`<tr><td><input value="${esc(p.name)}" onchange="updPerson(${p.id},'name',this.value)"></td>
      <td><select onchange="updPerson(${p.id},'department',this.value)">${deptOpts(p.department||'')}</select></td>
      <td><input value="${esc(p.monday_user_id||'')}" placeholder="Ej. 12345678" onchange="updPerson(${p.id},'monday_user_id',this.value)"></td>
      <td><button class="ghostdel" onclick="delPerson(${p.id})">✕</button></td></tr>`;
  });
  h+=`<tr class="add-row"><td><input id="npName" placeholder="Nombre"></td>
    <td><select id="npDept">${deptOpts('')}</select></td>
    <td><input id="npUid" placeholder="user_id"></td>
    <td><button onclick="addPerson()">+ Agregar</button></td></tr></tbody></table></div>`;

  // departamentos (con color para el Gantt)
  h+=`<div class="card"><div class="sechead"><span>Catálogo de departamentos → label / índice de Monday + color</span></div>
    <table><thead><tr><th style="width:30%">Departamento</th><th>Label en Monday</th><th>Índice</th><th>Color</th><th></th></tr></thead><tbody>`;
  depts.forEach(d=>{
    h+=`<tr><td><input value="${esc(d.name)}" onchange="updDept(${d.id},'name',this.value)"></td>
      <td><input value="${esc(d.monday_label||'')}" placeholder="Ej. Comercial" onchange="updDept(${d.id},'monday_label',this.value)"></td>
      <td><input type="number" value="${d.monday_index??''}" style="width:70px" onchange="updDept(${d.id},'monday_index',this.value?parseInt(this.value):null)"></td>
      <td><input type="color" value="${d.color||'#6b7177'}" style="width:46px;height:30px;padding:2px" onchange="updDept(${d.id},'color',this.value)"></td>
      <td><button class="ghostdel" onclick="delDept(${d.id})">✕</button></td></tr>`;
  });
  h+=`<tr class="add-row"><td><input id="ndName" placeholder="Depto"></td><td><input id="ndLabel" placeholder="label"></td>
    <td><input id="ndIdx" type="number" placeholder="idx" style="width:70px"></td>
    <td><input id="ndColor" type="color" value="#6b7177" style="width:46px;height:30px;padding:2px"></td>
    <td><button onclick="addDept()">+ Agregar</button></td></tr></tbody></table></div>`;
  $("#app").innerHTML=h;
}

async function saveStatusMap(){
  const m={};
  STATUSES.forEach((s,i)=>{const el=document.getElementById('sm_'+i);const v=(el&&el.value||'').trim();if(v!=='')m[s]=v;});
  await api("/api/config",{method:"PUT",body:JSON.stringify({status_map:JSON.stringify(m)})});
  toast("Mapeo de estatus guardado");
}

async function launch(){
  $("#launchBody").innerHTML="<div class='empty'>Validando y disparando…</div>";
  $("#launchFoot").innerHTML='<button onclick="dlgLaunch.close()">Cerrar</button>';
  dlgLaunch.showModal();
  const r=await api(`/api/projects/${STATE.id}/launch`,{method:"POST",body:JSON.stringify({})});
  if(r.blocked){
    let h=`<p class="issue error">No se publicó: hay errores que corregir.</p>`;
    h+=r.issues.map(i=>`<div class="issue ${i.level}">${esc(i.msg)}</div>`).join("");
    $("#launchBody").innerHTML=h;
    $("#launchFoot").innerHTML='<button onclick="dlgLaunch.close()">Cerrar</button><button class="primary" onclick="forceLaunch()">Publicar de todos modos</button>';
    return;
  }
  showLaunchResult(r);
  await loadProject(STATE.id);
}
async function forceLaunch(){
  const r=await api(`/api/projects/${STATE.id}/launch`,{method:"POST",body:JSON.stringify({force:true})});
  showLaunchResult(r); await loadProject(STATE.id);
}
function showLaunchResult(r){
  const issues=(r.issues||[]).map(i=>`<div class="issue ${i.level}">${esc(i.msg)}</div>`).join("");
  const groups=r.payload.groups.map(g=>`<li><b>${esc(g.title)}</b> — ${g.items.length} ítems</li>`).join("");
  $("#launchBody").innerHTML=`
    <div class="issue ${r.ok?'ok':'error'}">${r.ok?'✅':'⚠️'} ${esc(r.detail)}</div>
    ${issues}
    <p class="small" style="margin-top:10px">Board: <b>${esc(r.payload.board_id||'(sin configurar)')}</b> · Tablero: <b>${esc(r.payload.board_name)}</b></p>
    <ul>${groups}</ul>
    <p class="small">El proyecto quedó <b>Lanzado</b> y el payload (con IDs traducidos) se guardó en la base de datos.</p>`;
  $("#launchFoot").innerHTML='<button class="primary" onclick="dlgLaunch.close()">Listo</button>';
}
boot();
